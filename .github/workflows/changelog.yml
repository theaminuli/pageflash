name: Update Plugin Changelog

on:
  pull_request:
    types:
      - closed
    branches:
      - development

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add PR Reference to CHANGELOG.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Check if CHANGELOG.md exists
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md file not found"
            exit 1
          fi

          # Create the new changelog entry with PR reference
          NEW_ENTRY="- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL})) @${PR_AUTHOR}"

          # Find the first version section line number
          FIRST_VERSION_LINE=$(grep -n "^## " CHANGELOG.md | head -1 | cut -d':' -f1)

          if [ -z "$FIRST_VERSION_LINE" ]; then
            echo "No version section found in CHANGELOG.md"
            exit 1
          fi

          # Insert the new entry after the first version line
          sed -i "${FIRST_VERSION_LINE}a\\${NEW_ENTRY}" CHANGELOG.md

          echo "Added new changelog entry:"
          echo "$NEW_ENTRY"

      - name: Commit and Push Changes to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add PR #${PR_NUMBER} reference to changelog"
            git push origin development
          fi
