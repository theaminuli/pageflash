name: Update Plugin Changelog

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add PR Reference to CHANGELOG.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Check if CHANGELOG.md exists
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md file not found"
            exit 1
          fi

          # Get current date
          CURRENT_DATE=$(date +%Y-%m-%d)

          # Create the new changelog entry with PR reference
          NEW_ENTRY="- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL})) @${PR_AUTHOR}"

          # Find the first version section line number
          FIRST_VERSION_LINE=$(grep -n "^## " CHANGELOG.md | head -1 | cut -d':' -f1)

          if [ -z "$FIRST_VERSION_LINE" ]; then
            echo "No version section found in CHANGELOG.md"
            exit 1
          fi

          # Insert the new entry after the first version line
          sed -i "${FIRST_VERSION_LINE}a\\${NEW_ENTRY}" CHANGELOG.md

          echo "Added new changelog entry:"
          echo "$NEW_ENTRY"

      - name: Generate Formatted Changelog for readme.txt
        run: |
          # Check if CHANGELOG.md exists
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md file not found"
            exit 1
          fi

          # Extract the changelog content starting from '# Changelog'
          START_LINE=$(grep -n "^# Changelog" CHANGELOG.md | cut -d':' -f1)
          if [ -z "$START_LINE" ]; then
            echo "No '# Changelog' section found in CHANGELOG.md"
            exit 1
          fi

          # Extract the changelog entries, starting from the first '## ' section
          tail -n +$((START_LINE + 1)) CHANGELOG.md > changelog_entries.txt

          # Format the changelog entries into the desired format for readme.txt
          awk '
          BEGIN { print "== Changelog ==" }
          /^##/ {
            if (version != "") {
              print formatted_changelog;
            }
            version = $2;
            date = $4;
            formatted_changelog = "= " version " - " date " =";
            next;
          }
          /^- / {
            gsub(/^- /, "* ");
            formatted_changelog = formatted_changelog "\n" $0;
          }
          END {
            print formatted_changelog;
          }
          ' changelog_entries.txt > formatted_changelog.txt

          echo "Generated formatted changelog:"
          cat formatted_changelog.txt

      - name: Update readme.txt
        run: |
          # Check if readme.txt exists
          if [ ! -f "readme.txt" ]; then
            echo "readme.txt file not found"
            exit 1
          fi

          # Remove existing '== Changelog ==' and everything below it
          sed -i '/== Changelog ==/,$d' readme.txt

          # Add the new formatted changelog content
          cat formatted_changelog.txt >> readme.txt

      - name: Commit and Push Changes to GitHub
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md readme.txt

          # Check if there are staged changes before committing
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add PR #${PR_NUMBER} reference to changelog"
            git push origin ${{ github.event.pull_request.base.ref }}
          fi

      - name: Cleanup
        if: always()
        run: |
          # Delete temporary files
          rm -f formatted_changelog.txt changelog_entries.txt
