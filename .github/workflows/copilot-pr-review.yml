name: Copilot PR Description and Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  generate-description:
    name: Generate PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check and Generate PR Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Check if PR body is empty or contains only template placeholders
          is_empty_or_template() {
            local body="$1"
            # Check if body is empty
            if [ -z "$body" ]; then
              return 0
            fi
            # Remove HTML comments
            local cleaned=$(echo "$body" | perl -pe 's/<!--.*?-->//gs')
            # Remove whitespace
            cleaned=$(echo "$cleaned" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            # Remove lines that are just "Closes #XXX" or "Fixes #XXX" or "Resolves #XXX"
            cleaned=$(echo "$cleaned" | grep -vE '^(Closes|Fixes|Resolves)[[:space:]]+#[0-9]+[[:space:]]*$')
            # Remove empty lines and template headers
            cleaned=$(echo "$cleaned" | grep -v '^$' | grep -v '^## ')
            
            # If nothing remains, it's considered empty/template
            if [ -z "$cleaned" ]; then
              return 0
            fi
            return 1
          }

          if is_empty_or_template "$PR_BODY"; then
            echo "PR description is empty or contains only template. Generating description..."

            # Get list of changed files from the PR
            CHANGED_FILES=$(gh pr view $PR_NUMBER --json files --jq '.files[].path' | sort)
            # Count files - grep returns 1 when no match, so use || echo 0
            FILE_COUNT=$(echo "$CHANGED_FILES" | grep -c '.' || echo 0)

            # Get PR title
            PR_TITLE=$(gh pr view $PR_NUMBER --json title --jq '.title')
            
            # Extract issue number from PR body or title
            ISSUE_NUMBER=$(echo "$PR_BODY $PR_TITLE" | grep -oP '(?<=(Closes|Fixes|Resolves)\s#)\d+' | head -1 || echo "")
            
            # Initialize variables for issue details
            ISSUE_TITLE=""
            ISSUE_BODY=""
            ISSUE_REF=""
            
            # If issue number found, fetch issue details
            if [ -n "$ISSUE_NUMBER" ]; then
              echo "Found issue reference: #${ISSUE_NUMBER}. Fetching issue details..."
              ISSUE_REF="Fixes #${ISSUE_NUMBER}"
              
              # Fetch issue details
              ISSUE_DATA=$(gh issue view $ISSUE_NUMBER --json title,body)
              ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
              ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body')
              
              echo "Issue title: $ISSUE_TITLE"
            else
              ISSUE_REF=$(echo "$PR_BODY" | grep -oE '(Closes|Fixes|Resolves)[[:space:]]+#[0-9]+' || echo "")
            fi

            # AI Agent analyzes issue and generates intelligent description
            DESCRIPTION="> 🤖 _AI-generated description by GitHub Copilot_

          ## What?
          ${ISSUE_REF}
          "
            
            # Analyze issue context and generate concise summary
            if [ -n "$ISSUE_TITLE" ]; then
              # Extract key components from files changed
              COMPONENTS=$(echo "$CHANGED_FILES" | grep -oE '(admin|includes|assets|tests|\.github)/' | sort -u | tr '\n' ',' | sed 's/,$//' | sed 's/,/, /g')
              
              if [ -n "$COMPONENTS" ]; then
                DESCRIPTION="${DESCRIPTION}Implements changes in ${COMPONENTS} to address: **${ISSUE_TITLE}**
          "
              else
                DESCRIPTION="${DESCRIPTION}Resolves: **${ISSUE_TITLE}**
          "
              fi
              
              # Compact file summary
              if [ "$FILE_COUNT" -le 3 ]; then
                DESCRIPTION="${DESCRIPTION}
          <sub>Modified: $(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//' | sed 's/,/, /g')</sub>
          "
              else
                DESCRIPTION="${DESCRIPTION}
          <sub>${FILE_COUNT} files modified</sub>
          "
              fi
            fi

            # AI analyzes issue body and generates WHY section
            DESCRIPTION="${DESCRIPTION}

          ## Why?
          "
            
            if [ -n "$ISSUE_BODY" ]; then
              # Extract problem indicators from issue
              PROBLEM_KEYWORDS=$(echo "$ISSUE_BODY" | grep -oiE "(bug|issue|problem|error|not working|fails|broken|incorrect)" | head -1 || echo "")
              FEATURE_KEYWORDS=$(echo "$ISSUE_BODY" | grep -oiE "(feature|enhancement|improve|add|need|should|want)" | head -1 || echo "")
              
              if [ -n "$PROBLEM_KEYWORDS" ]; then
                DESCRIPTION="${DESCRIPTION}Resolves a critical ${PROBLEM_KEYWORDS} affecting user experience. "
              elif [ -n "$FEATURE_KEYWORDS" ]; then
                DESCRIPTION="${DESCRIPTION}Introduces new ${FEATURE_KEYWORDS} to enhance plugin functionality. "
              fi
              
              # Generate intelligent summary based on issue length
              ISSUE_LENGTH=$(echo "$ISSUE_BODY" | wc -c)
              if [ "$ISSUE_LENGTH" -gt 500 ]; then
                DESCRIPTION="${DESCRIPTION}The issue describes multiple scenarios requiring attention, which this PR systematically addresses through targeted code modifications."
              elif [ "$ISSUE_LENGTH" -gt 200 ]; then
                DESCRIPTION="${DESCRIPTION}As outlined in the issue, users encounter specific scenarios that need refinement in our current implementation."
              else
                DESCRIPTION="${DESCRIPTION}Addresses the requirements specified in issue #${ISSUE_NUMBER}."
              fi
            else
              DESCRIPTION="${DESCRIPTION}Enhances plugin capabilities as requested in issue #${ISSUE_NUMBER}."
            fi

            # AI generates HOW section by analyzing file patterns
            DESCRIPTION="${DESCRIPTION}

          ## How?
          "
            
            # Intelligent analysis of file types and locations
            PHP_FILES=$(echo "$CHANGED_FILES" | grep -c '\.php$' || echo 0)
            JS_FILES=$(echo "$CHANGED_FILES" | grep -c '\.\(js\|jsx\|ts\|tsx\)$' || echo 0)
            SCSS_FILES=$(echo "$CHANGED_FILES" | grep -c '\.\(scss\|sass\)$' || echo 0)
            CSS_FILES=$(echo "$CHANGED_FILES" | grep -c '\.css$' || echo 0)
            ADMIN_FILES=$(echo "$CHANGED_FILES" | grep -c '^admin/' || echo 0)
            INCLUDES_FILES=$(echo "$CHANGED_FILES" | grep -c '^includes/' || echo 0)
            
            CHANGES_MADE=false
            
            if [ "$ADMIN_FILES" -gt 0 ] || [ "$JS_FILES" -gt 0 ]; then
              DESCRIPTION="${DESCRIPTION}**Frontend Changes:** "
              if [ "$JS_FILES" -gt 0 ]; then
                DESCRIPTION="${DESCRIPTION}Refactored ${JS_FILES} JavaScript module(s) to optimize performance and user interaction. "
              fi
              if [ "$ADMIN_FILES" -gt 0 ]; then
                DESCRIPTION="${DESCRIPTION}Enhanced admin interface components for better usability. "
              fi
              DESCRIPTION="${DESCRIPTION}
          "
              CHANGES_MADE=true
            fi
            
            if [ "$INCLUDES_FILES" -gt 0 ] || [ "$PHP_FILES" -gt 0 ]; then
              DESCRIPTION="${DESCRIPTION}**Backend Changes:** "
              if [ "$PHP_FILES" -gt 3 ]; then
                DESCRIPTION="${DESCRIPTION}Restructured core PHP architecture across multiple files to improve code organization and maintainability. "
              elif [ "$PHP_FILES" -gt 0 ]; then
                DESCRIPTION="${DESCRIPTION}Updated ${PHP_FILES} PHP file(s) with improved logic and error handling. "
              fi
              DESCRIPTION="${DESCRIPTION}
          "
              CHANGES_MADE=true
            fi
            
            if [ "$SCSS_FILES" -gt 0 ] || [ "$CSS_FILES" -gt 0 ]; then
              TOTAL_STYLES=$((SCSS_FILES + CSS_FILES))
              DESCRIPTION="${DESCRIPTION}**Styling Updates:** Refined ${TOTAL_STYLES} stylesheet(s) for better visual consistency and responsiveness.
          "
              CHANGES_MADE=true
            fi
            
            if [ "$CHANGES_MADE" = false ]; then
              DESCRIPTION="${DESCRIPTION}Updated ${FILE_COUNT} file(s) with targeted improvements.
          "
            fi
            
            DESCRIPTION="${DESCRIPTION}
          *All modifications adhere to WordPress coding standards and maintain compatibility with PHP 7.4+ and WordPress 6.0+.*

          ## Testing Instructions
          "
            
            # Generate context-aware testing steps
            if [ -n "$ISSUE_TITLE" ]; then
              # Determine testing approach based on file types
              if [ "$JS_FILES" -gt 0 ] || [ "$ADMIN_FILES" -gt 0 ]; then
                DESCRIPTION="${DESCRIPTION}**UI Testing:**
          1. Navigate to the admin dashboard
          2. Interact with modified components
          3. Verify all user interactions work smoothly
          4. Check browser console for errors
          
          "
              fi
              
              if [ "$PHP_FILES" -gt 0 ]; then
                DESCRIPTION="${DESCRIPTION}**Functionality Testing:**
          1. Test the specific scenario: \"${ISSUE_TITLE}\"
          2. Verify expected behavior matches requirements
          3. Check PHP error logs for warnings
          
          "
              fi
              
              DESCRIPTION="${DESCRIPTION}**General Verification:**
          - Test on Chrome, Firefox, and Safari
          - Verify keyboard navigation and accessibility
          - Confirm no regression in existing features
          
          \`\`\`bash
          git fetch origin && git checkout $(gh pr view $PR_NUMBER --json headRefName --jq -r '.headRefName')
          \`\`\`
          "
            else
              DESCRIPTION="${DESCRIPTION}1. Checkout this branch and test affected functionality
          2. Verify all changes work as expected
          3. Check for errors in console and logs
          
          \`\`\`bash
          git fetch origin && git checkout $(gh pr view $PR_NUMBER --json headRefName --jq -r '.headRefName')
          \`\`\`
          "
            fi

            # Update PR description
            gh pr edit $PR_NUMBER --body "$DESCRIPTION"
            echo "PR description has been generated based on $FILE_COUNT changed file(s)."
          else
            echo "PR description already exists. Skipping generation."
          fi

  copilot-review:
    name: Copilot Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Request Copilot Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Assign Copilot to the PR for review
          gh pr edit $PR_NUMBER --add-assignee "@copilot" || echo "Note: Copilot assignment requires GitHub Copilot to be enabled in repository settings (Settings > Copilot > Pull Request Reviews)"
          echo "Copilot has been assigned to PR #$PR_NUMBER for review"