name: Copilot PR Description and Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  generate-description:
    name: Generate PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check and Generate PR Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Check if PR body is empty or contains only template placeholders
          is_empty_or_template() {
            local body="$1"
            # Check if body is empty
            if [ -z "$body" ]; then
              return 0
            fi
            # Check if body only contains template comments (hasn't been filled in)
            # Remove HTML comments and whitespace, then check if anything meaningful remains
            local cleaned=$(echo "$body" | perl -pe 's/<!--.*?-->//gs' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | grep -v '^## ' | grep -v '^Closes[[:space:]]*$')
            if [ -z "$cleaned" ]; then
              return 0
            fi
            return 1
          }

          if is_empty_or_template "$PR_BODY"; then
            echo "PR description is empty or contains only template. Generating description..."

            # Get list of changed files from the PR
            CHANGED_FILES=$(gh pr view $PR_NUMBER --json files --jq '.files[].path' | sort)
            # Count files - grep returns 1 when no match, so use || echo 0
            FILE_COUNT=$(echo "$CHANGED_FILES" | grep -c '.' || echo 0)

            # Get PR title
            PR_TITLE=$(gh pr view $PR_NUMBER --json title --jq '.title')

            # Generate description based on changed files following PR template format
            DESCRIPTION="## What?
          Closes #<!-- ISSUE-NUMBER - Please link to the related issue -->

          This PR modifies **${FILE_COUNT} file(s)**:
          "

            # Add file list (limited to first 20 files to avoid too long descriptions)
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                DESCRIPTION="${DESCRIPTION}
          - \`${file}\`"
              fi
            done <<< "$(echo "$CHANGED_FILES" | head -20)"

            # Add note if there are more files
            if [ "$FILE_COUNT" -gt 20 ]; then
              REMAINING=$((FILE_COUNT - 20))
              DESCRIPTION="${DESCRIPTION}
          - ... and ${REMAINING} more file(s)"
            fi

            DESCRIPTION="${DESCRIPTION}

          ## Why?
          _Please describe why this PR is necessary:_
          - What problem does it solve?
          - What user need or bug does it address?

          ## How?
          _Please describe the implementation details:_
          - What approach was taken?
          - What are the key changes?

          ## Testing Instructions
          1. Review the changed files listed above
          2. Pull this branch and test locally
          3. Verify the changes align with the PR title: \"${PR_TITLE}\"
          4. Test any affected functionality
          5. Check for any errors in browser console or PHP logs
          "

            # Update PR description
            gh pr edit $PR_NUMBER --body "$DESCRIPTION"
            echo "PR description has been generated based on $FILE_COUNT changed file(s) and features."
          else
            echo "PR description already exists. Skipping generation."
          fi

  copilot-review:
    name: Copilot Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Request Copilot Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Assign Copilot to the PR for review
          # Note: GitHub Copilot code review is automatically triggered when enabled
          # in repository settings. This step assigns Copilot to track the PR.
          gh pr edit $PR_NUMBER --add-assignee "@copilot" || echo "Note: Copilot assignment requires GitHub Copilot to be enabled in repository settings (Settings > Copilot > Pull Request Reviews)"
          echo "Copilot has been assigned to PR #$PR_NUMBER for review"
